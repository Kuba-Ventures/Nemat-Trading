    <script>
      // Canonical has to be set here rather than hardcoded above: one static
      // index.html serves every route, so a fixed canonical would declare
      // /how-it-works and /past-drops duplicates of the homepage and drop them
      // from the index. Dropping the query string also stops ad click ids
      // (fbclid, gclid, utm_*) from spawning a duplicate URL per click.
      (function () {
        var path = location.pathname.replace(/\/+$/, "");
        var link = document.createElement("link");
        link.rel = "canonical";
        link.href = "https://www.tommytopdecker.com" + (path || "/");
        document.head.appendChild(link);
      })();
    </script>
