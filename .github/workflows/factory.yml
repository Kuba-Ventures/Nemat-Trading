name: factory

# Supervised PR factory. Two required checks:
#   factory-tests  — typecheck gate (builds the shared libs and typechecks every
#                    artifact) plus any package-level test suites that exist
#                    (`pnpm -r test`, run only where a `test` script is present)
#   factory-review — runs the vendored pr-reviewer agent and takes its verdict as
#                    typed JSON (--json-schema), never as prose parsed out of a
#                    comment. APPROVE-LOWRISK labels `auto-merge-eligible`;
#                    ESCALATE labels `escalated`; anything else means the gate
#                    itself failed, which labels `review-inconclusive` and fails
#                    the check rather than quietly looking like a policy call.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: factory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  factory-tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (factory gate)
        run: pnpm run typecheck
      - name: Tests (factory gate)
        run: pnpm -r --if-present run test

  factory-review:
    needs: factory-tests
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fail fast with a clear message (and show WHICH secret name is set, never the
      # value) instead of letting the action die deep inside with a cryptic error.
      - name: Check Claude auth secret
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "CLAUDE_CODE_OAUTH_TOKEN set: $([ -n "$OAUTH" ] && echo yes || echo no)"
          echo "ANTHROPIC_API_KEY set:       $([ -n "$APIKEY" ] && echo yes || echo no)"
          if [ -z "$OAUTH" ] && [ -z "$APIKEY" ]; then
            echo "::error::No Claude auth secret is reaching this repo. An org admin must add CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY) as a repository secret on Kuba-Ventures/Nemat-Trading, or grant the org secret access to this repo."
            exit 1
          fi

      # The verdict comes back as typed JSON via --json-schema, not as prose the
      # workflow has to grep out of a comment. The previous version asked the agent
      # to run `gh pr comment` and then parsed the comments for a VERDICT line; the
      # agent never ran the command, so every PR parsed as "<none>" and fell into
      # the escalate branch. A broken reviewer and a genuine risk finding were
      # indistinguishable, and the Phase 2 soak measured nothing. See #81.
      - name: Factory review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are running in CI for pull request #${{ github.event.pull_request.number }}
            in repo ${{ github.repository }}. The base branch is
            "${{ github.event.pull_request.base.ref }}" and the factory test gate
            (typecheck) has already PASSED for this PR — treat tests as green.

            Use the **pr-reviewer** subagent (defined in .claude/agents/pr-reviewer.md) to
            review this PR against the merge policy in CLAUDE.md.

            Do NOT post a comment yourself. The workflow posts your review for you,
            so that a review always reaches the PR even if a tool call fails.

            Return:
            - verdict: "APPROVE-LOWRISK" only if the change is inside the low-risk
              surfaces in CLAUDE.md and every changed behaviour is covered by a
              passing test. Otherwise "ESCALATE".
            - reason: one concrete sentence. For ESCALATE, name the specific file or
              rule that triggered it.
            - review: the full review in markdown, for a human to read.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash,Task"
            --max-turns 25
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["APPROVE-LOWRISK","ESCALATE"],"description":"The merge-policy verdict"},"reason":{"type":"string","description":"One concrete sentence justifying the verdict"},"review":{"type":"string","description":"Full review in markdown for a human reader"}},"required":["verdict","reason","review"]}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post review and enforce verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          STRUCTURED: ${{ steps.review.outputs.structured_output }}
        run: |
          set -euo pipefail

          label() { gh label create "$1" --color "$2" --description "$3" 2>/dev/null || true; }
          label auto-merge-eligible 0E8A16 "Factory would auto-merge (Phase 2 soak: human merges)"
          label escalated           B60205 "Factory routed this PR to a human"
          label review-inconclusive D93F0B "Factory review produced no verdict — the gate itself is broken"

          # Labels are mutually exclusive; a re-review must not leave the old one on.
          for l in auto-merge-eligible escalated review-inconclusive; do
            gh pr edit "$PR" --remove-label "$l" 2>/dev/null || true
          done

          inconclusive() {
            echo "::error::$1"
            gh pr edit "$PR" --add-label review-inconclusive
            gh pr comment "$PR" --body "**Factory review did not return a verdict.** $1

          This is a failure of the review gate itself, not a judgement about this PR.
          A human needs to review it directly, and the gate needs fixing before the
          soak means anything. See #81."
            exit 1
          }

          if [ -z "${STRUCTURED:-}" ]; then
            inconclusive "The reviewer produced no structured output at all."
          fi
          if ! printf '%s' "$STRUCTURED" | jq -e . >/dev/null 2>&1; then
            inconclusive "The reviewer's structured output was not valid JSON."
          fi

          verdict=$(printf '%s' "$STRUCTURED" | jq -r '.verdict // empty')
          reason=$(printf '%s' "$STRUCTURED" | jq -r '.reason // empty')
          review=$(printf '%s' "$STRUCTURED" | jq -r '.review // empty')

          case "$verdict" in
            APPROVE-LOWRISK|ESCALATE) ;;
            *) inconclusive "Expected APPROVE-LOWRISK or ESCALATE, got '${verdict:-<empty>}'." ;;
          esac

          # The workflow posts the review, so it is on the PR whether or not the
          # agent managed a tool call.
          {
            printf '%s\n\n---\n\n' "$review"
            printf '**VERDICT: %s** — %s\n' "$verdict" "$reason"
          } | gh pr comment "$PR" --body-file -

          echo "Verdict: $verdict — $reason"

          if [ "$verdict" = "APPROVE-LOWRISK" ]; then
            # PHASE 2 (soak): observe-only. Label what the factory WOULD auto-merge,
            # but leave the merge to a human so we can watch for escapes.
            echo "APPROVE-LOWRISK — Phase 2 soak: labeling, not merging."
            gh pr edit "$PR" --add-label auto-merge-eligible
            # PHASE 3: after a clean two-week soak, replace the label line above with:
            #   gh pr merge "$PR" --squash --auto
          else
            echo "ESCALATE — routing to a human."
            gh pr edit "$PR" --add-label escalated
            # Check stays green so a human can merge manually; do not auto-merge.
          fi
